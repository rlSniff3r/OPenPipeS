<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenPipeS Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .severity-critical { background: #dc3545; color: #fff; }
    .severity-high     { background: #fd7e14; color: #fff; }
    .severity-medium   { background: #ffc107; color: #000; }
    .severity-low      { background: #0d6efd; color: #fff; }
    .severity-info     { background: #6c757d; color: #fff; }
    .card-stat { transition: transform .15s; }
    .card-stat:hover { transform: translateY(-2px); }
    .badge-cvss { font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">🔥 OpenPipeS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="/">📊 Visão Geral</a></li>
          <li class="nav-item"><a class="nav-link" href="/hosts">🖥️ Hosts</a></li>
          <li class="nav-item"><a class="nav-link" href="/vulns">⚠️ Vulnerabilidades</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
